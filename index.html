<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>JokenPô</title>
</head>

<body>

    <div class="container">
        <h1>JokenPô</h1>
        <div class="buttons">
            <button  id="rock" onclick="playHuman('rock')">&#128074</button>
            <button  id="paper" onclick="playHuman('paper')">&#128400</button>
            <button  id="scissors" onclick="playHuman('scissors')">&#9996</button>
        </div>

        <p class="result"></p>
        <p>Máquina escolheu: <span id="machine-choice"></span> 
           Você escolheu: <span id="human-choice"></span></p>

        <p class="your-score">Sua pontuação: <span id="human-score">0</span></p>
        <p class="machine-score">Pontuação Máquina: <span id="machine-score">0</span></p>
    </div>

    <script src="./script.js"></script>

</body>

</html>
